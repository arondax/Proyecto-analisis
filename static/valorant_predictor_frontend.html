
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.vp-wrap { padding: 1.5rem 0; }
.vp-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
.vp-logo { width: 36px; height: 36px; background: #ff4655; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.vp-logo svg { width: 20px; height: 20px; fill: white; }
.vp-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.vp-subtitle { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.vp-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; }
.vp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.vp-field { display: flex; flex-direction: column; gap: 6px; }
.vp-field.full { grid-column: 1 / -1; }
label { font-size: 13px; color: var(--color-text-secondary); font-weight: 500; }
input, select { width: 100%; }
.vp-toggle { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); cursor: pointer; }
.vp-toggle input[type=checkbox] { width: 16px; height: 16px; accent-color: #ff4655; cursor: pointer; flex-shrink: 0; }
.vp-toggle span { font-size: 14px; color: var(--color-text-primary); }
.vp-toggle small { font-size: 12px; color: var(--color-text-secondary); display: block; }
.vp-btn { width: 100%; margin-top: 16px; padding: 10px; background: #ff4655; border: none; border-radius: var(--border-radius-md); color: white; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s; }
.vp-btn:hover { opacity: 0.88; }
.vp-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.vp-result { margin-top: 12px; border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; display: none; }
.vp-result-header { padding: 10px 16px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.vp-result.victoria .vp-result-header { background: #e8f5e9; color: #2e7d32; }
.vp-result.derrota .vp-result-header { background: #ffebee; color: #c62828; }
.vp-result-body { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vp-stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; text-align: center; }
.vp-stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.vp-stat-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.vp-error { margin-top: 10px; padding: 10px 14px; background: #ffebee; border-radius: var(--border-radius-md); font-size: 13px; color: #c62828; display: none; }
.vp-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.vp-divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 12px 0; }
</style>

<div class="vp-wrap">
  <h2 class="sr-only">Valorant Predictor</h2>

  <div class="vp-header">
    <div class="vp-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 7l9 2 9-2-9-5L3 7zm0 0v8l9 4 9-4V7"/></svg>
    </div>
    <div>
      <p class="vp-title">Predictor de partidas</p>
      <p class="vp-subtitle">Introduce los datos antes de empezar</p>
    </div>
  </div>

  <div class="vp-card">
    <div class="vp-grid">
      <div class="vp-field">
        <label for="nombre">Nombre de jugador</label>
        <input type="text" id="nombre" placeholder="rondax" />
      </div>
      <div class="vp-field">
        <label for="tag">Tag</label>
        <input type="text" id="tag" placeholder="EUW" />
      </div>
      <div class="vp-field">
        <label for="region">Región</label>
        <select id="region">
          <option value="eu">Europa (EU)</option>
          <option value="na">Norteamérica (NA)</option>
          <option value="ap">Asia-Pacífico (AP)</option>
          <option value="kr">Corea (KR)</option>
        </select>
      </div>
      <div class="vp-field">
        <label for="mapa">Mapa</label>
        <select id="mapa">
          <option value="">Cargando mapas...</option>
        </select>
      </div>
      <div class="vp-field">
        <label for="amigos">Amigos en el equipo</label>
        <select id="amigos">
          <option value="0">0 - solo</option>
          <option value="1">1 - amigo</option>
          <option value="2">2 - amigos</option>
          <option value="3">3 - amigos</option>
          <option value="4">4 - amigos (full premade)</option>
        </select>
      </div>
      <div class="vp-field" style="justify-content: flex-end;">
        <label>¿Juegas tu main?</label>
        <label class="vp-toggle" for="main">
          <input type="checkbox" id="main" />
          <div>
            <span>Agente principal</span>
            <small>Marca si vas a jugar tu personaje habitual</small>
          </div>
        </label>
      </div>
    </div>

    <button class="vp-btn" id="btn-predecir" onclick="hacerPrediccion()">
      <i class="ti ti-bolt" aria-hidden="true"></i>
      Predecir resultado
    </button>

    <div class="vp-error" id="error-msg"></div>

    <div class="vp-result" id="resultado">
      <div class="vp-result-header" id="resultado-header">
        <i class="ti ti-trophy" aria-hidden="true"></i>
        <span id="resultado-texto"></span>
      </div>
      <div class="vp-result-body">
        <div class="vp-stat">
          <p class="vp-stat-label">Rondas ganadas</p>
          <p class="vp-stat-value" id="rondas-g">—</p>
        </div>
        <div class="vp-stat">
          <p class="vp-stat-label">Rondas perdidas</p>
          <p class="vp-stat-value" id="rondas-p">—</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "http://172.20.10.8:8000";

async function cargarMapas() {
  try {
    const res = await fetch(`${API_URL}/mapas`);
    const data = await res.json();
    const sel = document.getElementById("mapa");
    sel.innerHTML = data.mapas.map(m => `<option value="${m}">${m}</option>`).join("");
  } catch {
    document.getElementById("mapa").innerHTML = '<option value="">Error al cargar mapas</option>';
  }
}

async function hacerPrediccion() {
  const btn = document.getElementById("btn-predecir");
  const errEl = document.getElementById("error-msg");
  const resEl = document.getElementById("resultado");

  errEl.style.display = "none";
  resEl.style.display = "none";

  const nombre = document.getElementById("nombre").value.trim();
  const tag = document.getElementById("tag").value.trim();
  const mapa = document.getElementById("mapa").value;

  if (!nombre || !tag || !mapa) {
    errEl.textContent = "Rellena nombre, tag y mapa antes de continuar.";
    errEl.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="vp-spinner"></div> Prediciendo...';

  const payload = {
    nombre,
    tag,
    region: document.getElementById("region").value,
    mapa,
    es_main: document.getElementById("main").checked,
    num_amigos: parseInt(document.getElementById("amigos").value)
  };

  try {
    const res = await fetch(`${API_URL}/predecir`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || `Error ${res.status}`);
    }

    const data = await res.json();
    const esVictoria = data.resultado === "Victoria";

    resEl.className = "vp-result " + (esVictoria ? "victoria" : "derrota");
    document.getElementById("resultado-header").querySelector("i").className =
      "ti " + (esVictoria ? "ti-trophy" : "ti-mood-sad");
    document.getElementById("resultado-texto").textContent =
      (esVictoria ? "Victoria" : "Derrota") + " predicha — " + mapa;
    document.getElementById("rondas-g").textContent = data.rondas_ganadas.toFixed(1);
    document.getElementById("rondas-p").textContent = data.rondas_perdidas.toFixed(1);
    resEl.style.display = "block";

  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-bolt" aria-hidden="true"></i> Predecir resultado';
  }
}

cargarMapas();
</script>
