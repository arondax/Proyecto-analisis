name: Script Github revison mensual de inactivos

on: 
    schedule:
        - cron: '0 8 1 * *' # Ejecutar el primer día de cada mes a las 8:00 AM
    workflow_dispatch: # Permite ejecutar el workflow manualmente desde la interfaz de GitHub

permissions:
    contents: write

jobs:
    run-python:
        runs-on: windows-latest

        steps:
            - name: Recopilar los datos del repositorio
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
            
            - name: Actualizar PIP
              run: python -m pip install --upgrade pip

            - name: Instalar dependencias desde resquirements.txt
              run: pip install -r requirements.txt
            
            - name: Listar entorno instalado
              run: python -m pip list

            - name: Ejecutar revision mensual de inactivos
              env:
                VALORANT_API_KEY: ${{ secrets.VALORANT_API_KEY }}
                PYTHONIOENCODING: utf-8
              run: | 
                echo "=== INICIANDO REVISION MENSUAL DE INACTIVOS ==="
                python scripts/script_revision_mensual.py
                echo "=== REVISION FINALIZADA ===""
            
            - name: Subir cambios
              shell: bash
              run: |
                    git config --local user.name 'github-actions[bot]'
                    git config --local user.email 'github-actions[bot]@users.noreply.github.com'
            
                    git add -A
            
                    echo "=== ESTADO DE GIT ANTES DEL COMMIT ==="
                    git status
            
                    git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Revisión mensual de jugadores inactivos" && git push origin HEAD:${{ github.ref_name }})
                        